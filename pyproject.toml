[project]
name = "job-application-assistant"
version = "0.1.0"
description = "A2A-orchestrated job application assistant using LangGraph, CrewAI, and AutoGen"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3",
    "langgraph>=0.2",
    "crewai>=0.80",
    "pyautogen>=0.4",
    "autogen-ext[openai]>=0.4",
    "mcp>=1.0",
    "a2a-sdk>=1.0",
    "openai>=1.0",
    "jinja2>=3.0",
    "click>=8.0",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.scripts]
mcp-server = "mcp_server.__main__:main"
research-agent = "agents.research.__main__:main"
writing-agent = "agents.writing.__main__:main"
interview-agent = "agents.interview.__main__:main"
client = "client.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server", "agents", "client"]